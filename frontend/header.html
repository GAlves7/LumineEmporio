<!-- HEADER: barra superior com logo, busca e ícones -->
<header>
    <div class="container-header">
        <!-- Logo -->
        <div class="logo">
            <a href="index.html">
                <img src="img/logos/logo1.png" alt="Logo Lumine Empório">
            </a>
        </div>

        <!-- Área central: busca e link sobre -->
        <div class="center-content">
            <form class="search-form" autocomplete="off">
                <div class="search-box">
                    <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <input 
                        type="text" 
                        placeholder="Buscar..." 
                        name="search_ignore_123" 
                        autocomplete="off" 
                        autocorrect="off"
                    >
                </div>
            </form>
            <!-- Container para resultados da pesquisa simplificada -->
            <div class="search-results"></div>

            <a href="sobre.html" class="sobre">Sobre</a>
            <a href="https://www.instagram.com/lumineemporio/" 
               class="social-instagram" 
               target="_blank" 
               title="Instagram da loja">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>

        <!-- Ícones interativos: tema, carrinho e perfil -->
        <div class="icons">
            <button class="btn-theme" title="Mudar tema">
                <i class="fa-solid fa-sun"></i>
            </button>
            <button class="btn-cart" title="Carrinho">
                <i class="fa-solid fa-cart-shopping"></i>
            </button>
            <button class="btn-user" title="Perfil">
                <i class="fa-solid fa-user"></i>
            </button>
        </div>
    </div>
</header>
