<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"> <!-- Define a codificação de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsividade -->

    <link rel="icon" type="image/x-icon" href="img/favicon.ico"> <!-- Ícone do site -->
    <title>Verificação de Código - Lumine Empório</title>

    <!-- Google Fonts e ícones Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS do site -->
    <link rel="stylesheet" href="css/style.css"> <!-- Estilos globais -->
    <link rel="stylesheet" href="css/header.css"> <!-- Estilos do header -->
    <link rel="stylesheet" href="css/footer.css"> <!-- Estilos do footer -->
    <link rel="stylesheet" href="css/login.css"> <!-- Estilos do modal de login -->
    <link rel="stylesheet" href="css/recuperarSenha.css"> <!-- Estilos específicos da página de recuperação -->
</head>
<body>
    <!-- HEADER: reutilizado do index, contém logo, busca e ícones -->
    <div id="headerArea"></div>

    <!-- CONTEÚDO PRINCIPAL DA PÁGINA DE VERIFICAÇÃO DE CÓDIGO -->
    <section class="recuperar-container">
        <div class="recuperar-box">
            <h2>Verificação de Código</h2>
            <p>Enviamos um código para seu e-mail. Digite-o abaixo para continuar:</p>

            <!-- Campo para digitar o código enviado por e-mail -->
            <input type="text" placeholder="Digite o código" id="codigoRecuperar">

            <!-- Botão estilizado como link para ir para a próxima etapa -->
            <a href="recuperarSenha3.html" class="btn-enviar">Continuar</a>
        </div>
    </section>

    <!-- MODAL DE LOGIN: reutilizado do index -->
    <div id="modalLoginArea"></div>

    <!-- FOOTER: rodapé do site -->
    <div id="footerArea"></div>

    <!-- Script principal: funcionalidades globais -->
    <script type="module">
        import { loadComponent } from "./js/include.js";
        loadComponent("headerArea", "header.html", "js/header.js");
        loadComponent("footerArea", "footer.html");
        loadComponent("modalLoginArea", "modalLogin.html", "js/login.js");
    </script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</body>
</html>
