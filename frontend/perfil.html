<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/x-icon" href="img/favicon.ico"> <!-- Ícone do site -->
    <title>Perfil - Lumine Empório</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>

    <!-- HEADER: reutilizado do index, contém logo, busca e ícones -->
    <div id="headerArea"></div>

    <!-- ======== CONTAINER PRINCIPAL ======== -->
    <div class="perfil-wrapper">

        <!-- FOTO DO USUÁRIO -->
        <div class="perfil-foto">
            <img src="img/userPerfil/userNovo.png" alt="Foto do usuário">
        </div>

        <!-- DADOS DO USUÁRIO -->
        <div class="perfil-info">
            <h2>Informações do Perfil</h2>

            <div class="perfil-dado">
                <span class="label">Nome completo:</span>
                <span class="valor">Nome Completo</span>
            </div>

            <div class="perfil-dado">
                <span class="label">Email:</span>
                <span class="valor">emailexemplo@gmail.com</span>
            </div>

            <div class="perfil-dado">
                <span class="label">Telefone:</span>
                <span class="valor" id="vl">(00) 00000-0000</span>
            </div>

            <!-- Botões -->
            <div class="perfil-botoes">
                <a href="editar-conta.html" class="btn editar">Editar Conta</a>
                <a href="historico-pedidos.html" class="btn historico">Histórico de Pedidos</a>
                <a href="index.html" class="btn sair">Sair</a>
            </div>
        </div>

    </div>

    <!-- MODAL DE LOGIN: aparece ao clicar no ícone de usuário -->
    <div id="modalLoginArea"></div>

    <!-- FOOTER: rodapé do site -->
    <div id="footerArea"></div>

    <!-- Scripts JS -->
    <script type="module">
        import { loadComponent } from "./js/include.js";
        loadComponent("headerArea", "header.html", "js/header.js");
        loadComponent("footerArea", "footer.html");
        loadComponent("modalLoginArea", "modalLogin.html", "js/login.js");
    </script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
