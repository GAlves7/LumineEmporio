<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Perfil — Lumine Empório</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>

    <!-- HEADER: reutilizado do index, contém logo, busca e ícones -->
    <header>
        <div class="container-header">
            <!-- Logo -->
            <div class="logo">
                <a href="index.html">
                    <img src="img/logos/logo1.png" alt="Logo Lumine Empório">
                </a>
            </div>
            <!-- Área central: busca e link sobre -->
            <div class="center-content">
                <div class="search-box">
                    <button><i class="fa-solid fa-magnifying-glass"></i></button>
                    <input type="text"> <!-- Campo de busca -->
                </div>
                <a href="#" class="sobre">Sobre</a>
            </div>
            <!-- Ícones interativos: tema, carrinho e perfil -->
            <div class="icons">
                <button class="btn-theme" title="Mudar tema">
                    <i class="fa-solid fa-sun"></i>
                </button>
                <button class="btn-cart" title="Carrinho">
                    <i class="fa-solid fa-cart-shopping"></i>
                </button>
                <button class="btn-user" title="Perfil">
                    <i class="fa-solid fa-user"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- ======== CONTAINER PRINCIPAL ======== -->
    <div class="perfil-wrapper">

        <!-- FOTO DO USUÁRIO -->
        <div class="perfil-foto">
            <img src="img/userPerfil/userNovo.png" alt="Foto do usuário">
        </div>

        <!-- DADOS DO USUÁRIO -->
        <div class="perfil-info">
            <h2>Informações do Perfil</h2>

            <div class="perfil-dado">
                <span class="label">Nome completo:</span>
                <span class="valor">Nome Completo</span>
            </div>

            <div class="perfil-dado">
                <span class="label">Email:</span>
                <span class="valor">emailexemplo@gmail.com</span>
            </div>

            <div class="perfil-dado">
                <span class="label">Telefone:</span>
                <span class="valor">(00) 00000-0000</span>
            </div>

            <!-- Botões -->
            <div class="perfil-botoes">
                <a href="editar-conta.html" class="btn editar">Editar Conta</a>
                <a href="historico-pedidos.html" class="btn historico">Histórico de Pedidos</a>
                <a href="index.html" class="btn sair">Sair</a>
            </div>
        </div>

    </div>

    <!-- FOOTER: rodapé do site -->
    <footer class="footer">
        <p>&copy; 2025 Lumine Empório. Todos os direitos reservados.</p>
    </footer>

    <script src="js/perfil.js"></script>
</body>
</html>
