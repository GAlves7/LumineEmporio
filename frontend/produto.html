<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <title>Produto - Lumine Empório</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Normalize -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/produto.css">

</head>
<body>

    <!-- HEADER -->
    <div id="headerArea"></div>

    <!-- MODAL LOGIN -->
    <div id="modalLoginArea"></div>

    <!-- PRODUTO CARD -->
    <section class="produto-wrapper">
        <div class="produto-card">

            <div class="produto-imagem">
                <img id="produto-img" src="" alt="Imagem do Produto">
            </div>

            <div class="produto-info">
                <h2 id="produto-nome"></h2>
                <p id="produto-descricao"></p>

                <div class="produto-dado">
                    <span class="label">Preço:</span>
                    <span class="valor" id="produto-preco"></span>
                </div>

                <div class="produto-dado">
                    <span class="label">Tamanho:</span>
                    <select id="produto-tamanho"></select>
                </div>

                <div class="produto-dado">
                    <span class="label">Cor:</span>
                    <select id="produto-cor"></select>
                </div>

                <div class="produto-dado">
                    <span class="label">Estoque:</span>
                    <span class="valor" id="produto-estoque"></span>
                </div>

                <div class="produto-botoes">
                    <button class="btn" id="btn-comprar">Adicionar ao carrinho</button>
                </div>
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <div id="footerArea"></div>

    <!-- SCRIPTS -->
    <script type="module">
        import { loadComponent } from "./js/include.js";
        loadComponent("headerArea", "header.html", "js/header.js");
        loadComponent("footerArea", "footer.html");
        loadComponent("modalLoginArea", "modalLogin.html", "js/login.js");
    </script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="js/produto.js"></script>

</body>
</html>
