<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"> <!-- Define a codificação de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsividade -->
    <title>Nova Senha - Lumine Empório</title>

    <!-- Google Fonts e ícones Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS do site -->
    <link rel="stylesheet" href="css/style.css"> <!-- Estilos globais -->
    <link rel="stylesheet" href="css/header.css"> <!-- Estilos do header -->
    <link rel="stylesheet" href="css/footer.css"> <!-- Estilos do footer -->
    <link rel="stylesheet" href="css/login.css"> <!-- Estilos do modal de login -->
    <link rel="stylesheet" href="css/recuperarSenha.css"> <!-- Estilos específicos da página de recuperação -->
</head>
<body>
    <!-- HEADER: reutilizado do index, contém logo, busca e ícones -->
    <header>
        <div class="container-header">
            <!-- Logo da loja -->
            <div class="logo">
                <a href="index.html">
                    <img src="img/logos/logo1.png" alt="Logo Lumine Empório">
                </a>
            </div>

            <!-- Área central: busca e link sobre -->
            <div class="center-content">
                <div class="search-box">
                    <button><i class="fa-solid fa-magnifying-glass"></i></button>
                    <input type="text" placeholder="Buscar...">
                </div>
                <a href="#" class="sobre">Sobre</a>
            </div>

            <!-- Ícones interativos: tema, carrinho e perfil -->
            <div class="icons">
                <button class="btn-theme" title="Mudar tema">
                    <i class="fa-solid fa-sun"></i>
                </button>
                <button class="btn-cart" title="Carrinho">
                    <i class="fa-solid fa-cart-shopping"></i>
                </button>
                <button class="btn-user" title="Perfil">
                    <i class="fa-solid fa-user"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL DA PÁGINA DE DEFINIÇÃO DE NOVA SENHA -->
    <section class="recuperar-container">
        <div class="recuperar-box">
            <h2>Definir Nova Senha</h2>
            <p>Digite a nova senha e confirme para concluir a recuperação:</p>

            <!-- Campo para digitar a nova senha com ícone de mostrar/ocultar -->
            <div class="password-container">
                <input type="password" placeholder="Nova senha" id="novaSenha">
                <i class="fa-solid fa-eye" id="toggleNovaSenha"></i>
            </div>

            <!-- Campo para confirmar a nova senha com ícone de mostrar/ocultar -->
            <div class="password-container">
                <input type="password" placeholder="Repita a nova senha" id="confirmarNovaSenha">
                <i class="fa-solid fa-eye" id="toggleConfirmarSenha"></i>
            </div>

            <!-- Botão estilizado como link para concluir a recuperação e voltar para a página inicial -->
            <a href="index.html" class="btn-enviar">Concluir</a>
        </div>
    </section>

    <!-- MODAL DE LOGIN: reutilizado do index -->
    <div class="login-modal" id="loginModal">
        <div class="login-content">
            <h3>Login</h3>
            <input type="email" placeholder="Email" id="loginEmail">

            <!-- Campo senha com ícone para mostrar/ocultar senha -->
            <div class="password-container">
                <input type="password" placeholder="Senha" id="loginPassword">
                <i class="fa-solid fa-eye" id="togglePassword"></i>
            </div>

            <!-- Link para recuperar senha -->
            <p class="forgot-password"><a href="recuperar-senha.html">Esqueceu a senha?</a></p>

            <button id="btnLogin">Entrar</button>
            <p>Não tem conta? <a href="cadastro.html">Registrar</a></p>
        </div>
    </div>

    <!-- FOOTER: rodapé do site -->
    <footer class="footer">
        <p>&copy; 2025 Lumine Empório. Todos os direitos reservados.</p>
    </footer>

    <!-- Script para mostrar/ocultar senha dos campos de nova senha -->
    <script>
        // Mostrar/ocultar nova senha
        const toggleNovaSenha = document.getElementById('toggleNovaSenha');
        const novaSenha = document.getElementById('novaSenha');

        toggleNovaSenha.addEventListener('click', () => {
            const type = novaSenha.getAttribute('type') === 'password' ? 'text' : 'password';
            novaSenha.setAttribute('type', type);
            toggleNovaSenha.classList.toggle('fa-eye-slash'); // alterna o ícone
        });

        // Mostrar/ocultar confirmação da nova senha
        const toggleConfirmarSenha = document.getElementById('toggleConfirmarSenha');
        const confirmarNovaSenha = document.getElementById('confirmarNovaSenha');

        toggleConfirmarSenha.addEventListener('click', () => {
            const type = confirmarNovaSenha.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmarNovaSenha.setAttribute('type', type);
            toggleConfirmarSenha.classList.toggle('fa-eye-slash'); // alterna o ícone
        });
    </script>

    <!-- Script principal: funcionalidades globais -->
    <script type="module" src="js/script.js"></script>

</body>
</html>
