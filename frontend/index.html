<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lumine Empório - Moda com estilo e conforto. Encontre roupas femininas e masculinas para todas as ocasiões.">
    <meta name="author" content="Lumine Empório">
    <meta name="keywords" content="moda, roupas, ecommerce, feminino, masculino, estilo, loja de roupas, lajedo, cosmeticos, perfume, creme">

    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <title>Catálogo - Lumine Empório</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Normalize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

    <!-- CSS globais -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/pagePrincipal.css">

</head>
<body>

    <!-- HEADER -->
    <div id="headerArea"></div>

    <!-- BANNER PRINCIPAL -->
    <section class="banner">
        <div class="carousel">
            <div class="slides">
                <div class="slide">
                    <a href="moda-feminina.html">
                        <img src="img/banners/modaFem.png" alt="Moda Feminina">
                    </a>
                </div>
                <div class="slide">
                    <a href="cosmeticos.html">
                        <img src="img/banners/cosme.png" alt="Cosméticos">
                    </a>
                </div>
            </div>
            <button class="prev"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="next"><i class="fa-solid fa-chevron-right"></i></button>
            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
            </div>
        </div>
    </section>

    <!-- CATALOGO -->
    <section class="catalogo-container">

        <div class="categoria">
            <h2 class="titulo-categoria">Moda Feminina</h2>
            <div class="cards-container" id="cat-feminina"></div>
        </div>

        <div class="categoria">
            <h2 class="titulo-categoria">Cosméticos</h2>
            <div class="cards-container" id="cat-cosmeticos"></div>
        </div>

    </section>

    <!-- MODAL DE LOGIN -->
    <div id="modalLoginArea"></div>

    <!-- FOOTER -->
    <div id="footerArea"></div>

    <!-- SCRIPTS -->
    <script type="module">
        import { loadComponent } from "./js/include.js";
        loadComponent("headerArea", "header.html", "js/header.js");
        loadComponent("footerArea", "footer.html");
        loadComponent("modalLoginArea", "modalLogin.html", "js/login.js");
    </script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="js/pagePrincipal.js"></script>

</body>
</html>
